<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="panel">
        <div class="logobar">
            <img id="odin" src="odin-lined.png">
            <p class="logotxt">ODIN</p>
        </div>
    </div>
    <div class="form-wrapper">
        <div class="cta">
            <div class="text-wrapper">
                <p>
                    This is not a real online service! You know you need something<br>like this in your life to help you realize your deepest dreams.<br>Sign up <i>now</i> to get started.
                </p>
                <p>You <i>know</i> you want to.</p>
            </div>
        </div>
        <div class="form">
            <div class="form-content">
                <p>Lets do this!</p>
                <div class="label-wrapper">
                    <form id="signup" action="tylertauth.com" method="post">
                        <div class="input-group">
                            <label for="first_name">First Name:</label>
                            <input type="text" id="first_name" minlength="1" maxlength="12" />
                        </div>
                        <div class="input-group">
                            <label for="last_name">Last Name:</label>
                            <input type="text" id="last_name" minlength="1" maxlength="12" />
                        </div>
                        <div class="input-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" />
                        </div>
                        <div class="input-group">
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" minlength="9" />
                        </div>
                        <div class="input-group">
                            <label for="password">Password:</label>
                            <input type="password" id="password" minlength="5" maxlength="15" />
                        </div>
                        <div class="input-group">
                            <label for="confirm-password">Confirm Password:</label>
                            <input type="password" id="confirm-password" minlength="5" maxlength="15" />
                        </div>
                    </form>
                </div>
            </div>  
        </div>
        <div class="submit">
            <div class="button-wrapper">
                <button class="create-acc" type="submit" form="signup">Create Account</button>
                <p>Already have  an account? <a href="https://www.youtube.com">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
